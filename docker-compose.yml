services:
  db:
    image: postgres:18.2
    container_name: siger-db
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en el archivo .env}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en el archivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - siger_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siger_pgdata: